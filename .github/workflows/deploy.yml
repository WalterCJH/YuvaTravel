name: Build and Deploy to IIS

on:
  push:
    branches: [ master ]   # 推到 master 就自動部署

jobs:
  deploy:
    runs-on: self-hosted  # 跑在你的 IIS Server

    steps:
    # 1. 拉取程式碼
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 安裝 .NET 10
    #- name: Setup .NET
    #  uses: actions/setup-dotnet@v4
    #  with:
    #    dotnet-version: '10.0.x'

    # 3. 還原套件
    - name: Restore
      run: dotnet restore ./Code/YuvaTravel.sln

    # 4. 編譯
    - name: Build
      run: dotnet build ./Code/YuvaTravel.sln -c Release --no-restore
      
    # 5. Publish
    - name: Publish
      run: dotnet publish ./Code/YuvaTravel.Web/YuvaTravel.Web.csproj -c Release --no-build -o ./publish

    # 6. 上線維護頁,讓 IIS 釋放 dll 鎖
    - name: Take site offline
      shell: powershell
      run: |
        $offline = Join-Path "${{ secrets.IIS_SITE_PATH }}" "app_offline.htm"
        Set-Content -Path $offline -Value '<html><body><h2>系統更新中,請稍候...</h2></body></html>' -Encoding UTF8 -Force
        Start-Sleep -Seconds 3

    # 7. 複製檔案 (/XF 排除 app_offline.htm 避免被 /MIR 刪掉)
    - name: Deploy Files
      shell: powershell
      run: |
        robocopy ./publish "${{ secrets.IIS_SITE_PATH }}" /MIR /NJH /NJS /XF app_offline.htm
        if ($LASTEXITCODE -le 7) { exit 0 }  # robocopy 成功碼是 0~7

    # 8. 撤下維護頁,下一個 request 觸發新版啟動 (失敗時也要執行避免站台卡在離線)
    - name: Bring site online
      if: always()
      shell: powershell
      run: |
        $offline = Join-Path "${{ secrets.IIS_SITE_PATH }}" "app_offline.htm"
        Remove-Item -Path $offline -Force -ErrorAction SilentlyContinue